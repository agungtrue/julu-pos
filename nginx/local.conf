server {
    listen 80;
    server_name admin.julucoffee.local www.admin.julucoffee.local;

    # resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        # set $upstream_app julu-admin;

        # PERBAIKAN 1: Gunakan Nama Service Docker, bukan IP
        # Sesuai docker-compose.yml sebelumnya, nama servicenya 'julu-admin'
        proxy_pass http://julu-web:3005;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}